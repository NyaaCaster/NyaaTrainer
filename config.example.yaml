# NyaaTrainer configuration example
#
# 用法：复制本文件为 config.yaml，然后按自己的环境修改。
#
#   cp config.example.yaml config.yaml
#
# config.yaml 已被 .gitignore 忽略，不会被提交 —— 你的本地路径不会进仓库。
#
# ★ 独立工作区说明：CE 由 runtime\bootstrap.ps1 统一装配到 <repo>\runtime\ce\Cheat Engine，
#   各脚本自动按该默认路径定位，本文件【不再】登记 paths.cheat_engine / paths.games_root。
#   环境变量仍可临时覆盖（优先级高于一切默认值）：
#     CE_DIR                 覆盖 src/ce_mcp_server.py 使用的 CE 目录
#     NYAA_TRAINER_CE_DIR    （老变量，仍被 agent 提示词认可）
#     CE_MCP_TIMEOUT         ce_mcp_server.py 的 MCP 请求超时（秒）

# ---------------------------------------------------------------------------
# 通用路径（仅 repo_root 与 temp_dir 需要用户关心；nu 不再要求必填）
# ---------------------------------------------------------------------------
paths:
  # 本仓库在本机的克隆位置（"."= 本文件所在目录的仓库根，通常保持 "." 即可）
  repo_root: "."

  # 临时产物目录：trainer 运行日志等（留空则用系统临时目录）
  temp_dir: ""

# ---------------------------------------------------------------------------
# Cheat Engine 运行时（bootstrap 装配，只读登记，不需要用户填写）
# ---------------------------------------------------------------------------
cheat_engine:
  # bootstrap 装配的版本（make_trainer 模板与通道兼容性均按此版本验证）
  version: "7.7"
  # 引导方式固定 main.lua 追加（CE 7.x 不执行 autorun\ 脚本）
  bootstrap: "main_lua"
  # LuaServer 命名管道名（main.lua 里 openLuaServer 的参数）
  pipe_name: "CELUASERVER"
  # 文件通道轮询间隔（毫秒），对应 extras\ceMCP.lua
  mcp_poll_ms: 20
  # MCP 请求超时（秒），也可用环境变量 CE_MCP_TIMEOUT 覆盖
  mcp_timeout_s: 10

# ---------------------------------------------------------------------------
# Agent / MCP 客户端配置
#   把 src/ce_mcp_server.py 登记进各自 MCP host（示例命令，路径替换为你的实际路径）：
#     python = <repo>\runtime\tools\python\python.exe   （内嵌 Python，无需安装）
#     args   = <repo>\src\ce_mcp_server.py
#     env    = CE_DIR: ""（留空自动解析到 runtime\ce\Cheat Engine）
# ---------------------------------------------------------------------------
agent:
  # 启动 MCP 服务端的标准命令
  mcp_command: "runtime/tools/python/python.exe"
  mcp_args:
    - "src/ce_mcp_server.py"
  mcp_env:
    CE_MCP_TIMEOUT: "10"

# ---------------------------------------------------------------------------
# 各游戏项目登记（可选）
#   每个游戏一个条目：code 用于文件命名与日志前缀。
# ⚠ dir 现在是【可选】——由 agent 会话现场确定后填写即可，不再是必填；
#   表文件建议放游戏目录内（<dir>\<code>_stable.CT），与游戏同级管理。
# ---------------------------------------------------------------------------
games: []
#  - code: pandora
#    name: "パンドラメイズ260427"
#    dir: "<games_root>/2026-6/パンドラメイズ260427"   # 会话现场确定
#    engine: "Unity Mono"
#    data_form: "static_field"     # static_field | instance_field
#    process: "Pandora.exe"
#    table: "examples/pandora/stable.CT"

# ---------------------------------------------------------------------------
# 外部依赖获取（bootstrap.ps1 自动完成；此表仅供 agent 提示词与人工排查参考）
# ---------------------------------------------------------------------------
tools:
  cheat_engine:
    name: "Cheat Engine"
    version: "7.7"
    fetched_by: "runtime/bootstrap.ps1（官网包下载 -> 7z 免安装解压 -> 安装包用后即删）"
    url: "https://cheatengine.org/"
    github: "https://github.com/cheat-engine/cheat-engine"
    license: "GPL-2.0"
    note: "国内网络下载大概率需开启翻墙软件（bootstrap 会先做连通性探测并给出提示）"

  python_embedded:
    name: "Python（内嵌）"
    version: "3.12.10 embeddable"
    built_in: "runtime/tools/python/"
    license: "PSF-2.0"
    note: "已随仓库分发，无需安装；三个 Python 脚本只用标准库，不需要 pip"

  powershell:
    name: "PowerShell"
    version: "5.1+ (推荐 7.x)"
    note: "Windows x64 自带，无需安装"

# ---------------------------------------------------------------------------
# 行为开关
# ---------------------------------------------------------------------------
options:
  # 生成 trainer 时是否默认打包 Mono 支持（Unity Mono 游戏必需）
  trainer_pack_mono: true

  # 生成 trainer 时是否默认打包 win64 符号库（缺了 Mono 注入会失败）
  trainer_pack_symbols: true

  # 面板字号（影响生成出的修改器界面大小；200% 缩放下建议 12-16）
  panel_font_size: 16
